<div class="page">
  <header>
    <div class="head-row">
      <h1>Rhymes</h1>
      <a routerLink="/settings" class="settings-link" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      </a>
    </div>
    <label class="field">
      <span class="field-label">Word</span>
      <input type="text" [value]="word()" (change)="setWord($any($event.target).value)" placeholder="Type a word" autocomplete="off" />
    </label>
  </header>

  @if (showColdLoad) {
    <p class="debug-timing">cold load: {{ coldLoadMs() === null ? 'warming up…' : coldLoadMs() + ' ms' }}</p>
  }

  <app-quick-rhyme-bar [word]="word()" [hideExplicit]="hideExplicit()" (useWord)="useWord($event)" (seeAll)="openSheet()" />

  @if (isDesktop() || sheetOpen()) {
    <app-rhyme-sheet class="panel" [word]="word()" [hideExplicit]="hideExplicit()" (closed)="closeSheet()" />
  }
</div>
